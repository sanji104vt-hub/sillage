<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Sillage favicon: Didot風の高コントラストセリフ「S」に、
    右上に金の粒(=残り香)を1点添える。
    背景は透過(ブラウザタブでOSのライト/ダーク両対応)。
    - S本体は #c9b558 (Sillageゴールド)
    - 粒は #c4889c (ピンク)
    - Sの中心軸(高コントラスト)は幅16、細部セリフは幅3〜4
  -->

  <!-- 縦長エレガントS。上のカーブから下のカーブへ滑らかに流れる。
       stroke: none、fill only で描画(小サイズでの潰れを回避)。 -->
  <path fill="#c9b558" d="
    M 66 22
    C 66 15, 58 12, 48 12
    C 33 12, 24 20, 24 30
    C 24 40, 33 44, 46 47
    C 60 51, 68 55, 68 66
    C 68 78, 58 86, 44 86
    C 32 86, 24 82, 24 76
    L 24 68
    C 24 72, 30 77, 42 77
    C 54 77, 60 71, 60 65
    C 60 57, 52 54, 42 51
    C 30 47, 22 42, 22 32
    C 22 20, 32 8, 50 8
    C 62 8, 66 12, 66 16
    L 66 22
    Z" />

  <!-- 上下のセリフ装飾(細い水平線)。極めて薄く、Didot的なコントラスト演出。 -->
  <line x1="20" y1="12" x2="34" y2="12" stroke="#c9b558" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="86" x2="68" y2="86" stroke="#c9b558" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 残り香の粒(右上に静かに1点)。ピンクで暖かみを添える。 -->
  <circle cx="80" cy="20" r="4" fill="#c4889c"/>
</svg>
